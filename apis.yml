  - name: Properties
    type: Properties
    data:
      - name: SiriusXM
        url: https://www.siriusxm.com/
        description: >-
          Flagship subscription satellite radio and streaming service delivering
          music, sports, news, talk, comedy, and podcasts to roughly 33 million
          paid subscribers across North America. Distributed in connected vehicles
          via OEM partnerships, on the SiriusXM app, on smart speakers, and via
          the web player.
        features:
          - Satellite Radio
          - Streaming Audio
          - Connected Vehicle Distribution
          - Sports Play-by-Play
          - News and Talk
          - Original Programming
          - Specialty Channels
      - name: Pandora
        url: https://www.pandora.com/
        description: >-
          Ad-supported and premium music streaming service serving approximately
          40 million active users. Offers personalized stations, on-demand
          listening (Pandora Plus / Premium tiers), and podcasts. Operates the
          Pandora Developer Center, a GraphQL-based partner API surface.
        features:
          - Ad-Supported Streaming
          - Premium Subscription Tier
          - Personalized Stations
          - Music Genome Project
          - Pandora Developer API (GraphQL)
          - Podcast Listening
        properties:
          - type: DeveloperPortal
            url: https://developer.pandora.com/
      - name: SiriusXM Media
        url: https://www.siriusxmmedia.com/
        description: >-
          Combined audio advertising sales organization spanning SiriusXM,
          Pandora, AdsWizz, Simplecast, and Stitcher Ads. Acts as the
          single front door for advertisers buying across the SiriusXM
          Holdings audio inventory.
        features:
          - Ad Sales
          - Cross-Portfolio Inventory
          - Audio Campaigns
          - Brand Sponsorships
      - name: AdsWizz
        url: https://www.adswizz.com/
        description: >-
          Programmatic digital-audio advertising technology company.
          Provides server-side and client-side ad insertion, SSP (AudioMax),
          DSP (AudioMatic), self-serve buying (AudioGO), campaign management
          (AudioServe), measurement and attribution, and mobile/web SDKs.
          Operates a documented public Domain API and SDK suite.
        features:
          - Programmatic Audio
          - Ad Insertion
          - VAST Ad Tech
          - AudioMax SSP
          - AudioMatic DSP
          - AudioGO Self-Serve
          - iOS, Android, Web SDKs
        properties:
          - type: APIDocumentation
            url: https://docs.adswizz.com/domain-api/v8/
          - type: SDKDocumentation
            url: https://docs.sdk.adswizz.com/
          - type: GitHubOrganization
            url: https://github.com/adswizz
      - name: Simplecast
        url: https://www.simplecast.com/
        description: >-
          Podcast hosting, distribution, and analytics platform. Provides
          publishers a CMS and a public REST API for managing shows, episodes,
          and analytics. Authentication is API token via bearer header.
        features:
          - Podcast Hosting
          - Episode Management
          - Distribution
          - Analytics
          - Public REST API
        properties:
          - type: APIDocumentation
            url: https://apidocs.simplecast.com/
          - type: APIBaseURL
            url: https://api.simplecast.com/
      - name: Pandora AMP
        url: https://amp.pandora.com/
        description: >-
          Artist Marketing Platform giving artists and labels access to
          listener data, audio messaging (AMPcast), featured-track promotion,
          and merch integrations across Pandora's listener base.
        features:
          - Artist Analytics
          - Audio Messaging
          - Featured Track Promotion
          - Merch Integration
      - name: SiriusXM Connected Vehicle Services
        url: https://www.siriusxmconnectedvehicles.com/
        description: >-
          B2B platform supplying telematics, infotainment, safety, security,
          and over-the-air services to automaker OEM partners. Distinct from
          the consumer satellite-radio subscription business.
        features:
          - Connected Car Telematics
          - OEM Partnerships
          - In-Vehicle Infotainment
          - Safety and Security Services
      - name: SiriusXM Marine
        url: https://www.siriusxm.com/marine
        description: >-
          Satellite-delivered weather, fishing, and entertainment data for
          recreational and commercial marine users.
        features:
          - Marine Weather
          - Fishing Data
          - Satellite Audio
      - name: SiriusXM Aviation
        url: https://www.siriusxm.com/aviation
        description: >-
          Satellite-delivered weather and audio entertainment data for
          general aviation cockpits via compatible avionics.
        features:
          - Aviation Weather
          - Cockpit Audio
          - Avionics Integration
      - name: SiriusXM for Business
        url: https://business.siriusxm.com/
        description: >-
          Commercial music and audio service for restaurants, retail, fitness,
          and other commercial venues. Sister service to Pandora for Business
          and Pandora CloudCover.
        features:
          - Commercial Music
          - Background Audio
          - Multi-Location Management
      - name: Pandora for Business / CloudCover
        url: https://business.pandora.com/
        description: >-
          Commercial background-music service for businesses, built on the
          Pandora streaming platform via the CloudCover acquisition.
        features:
          - Background Music
          - Commercial Licensing
          - Multi-Location Streaming


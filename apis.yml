aid: sirius-xm-holdings
name: Sirius XM Holdings
description: >-
  Sirius XM Holdings Inc. (NASDAQ: SIRI) is the leading audio entertainment company
  in North America, operating a portfolio of subscription, ad-supported streaming,
  podcast, and advertising-technology businesses. Its flagship satellite radio service
  SiriusXM serves roughly 33 million paid subscribers, while Pandora delivers
  ad-supported and premium music streaming to approximately 40 million active users.
  The portfolio also includes podcast network Simplecast, programmatic audio adtech
  platform AdsWizz, audio sales arm SiriusXM Media, and Pandora AMP. SiriusXM
  Holdings was split off from Liberty Media in September 2024, becoming an
  independent publicly traded company. This holdings-level index points to the
  operating subsidiaries; the consolidated developer surface is profiled in the
  `sirius-xm` repository, with no separate corporate developer program at the
  holding-company level.
